[project]
name = "asyncpulse"
version = "0.1.0"
description = "Bounded asynchronous API aggregation with adaptive scheduling"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1", "httpx>=0.27,<1", "redis>=5,<7", "sqlalchemy[asyncio]>=2,<3", "asyncpg>=0.29,<1", "prometheus-client>=0.20,<1"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2", "ruff>=0.9,<1", "locust>=2.32,<3", "matplotlib>=3.9,<4", "psutil>=6,<8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100
